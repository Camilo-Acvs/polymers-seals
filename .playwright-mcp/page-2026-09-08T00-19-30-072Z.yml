  - generic [ref=f1e15]:
    - generic [ref=f1e17]:
      - generic [ref=f1e18]: Tecnología de materiales
      - heading [level=1] [ref=f1e19]:
        - text: POLYKRAN
        - superscript [ref=f1e20]: ®
      - paragraph [ref=f1e21]: Tecnología de materiales elastoméricos avanzados para mejorar el desempeño en aplicaciones Oil & Gas bajo condiciones extremas.
      - paragraph [ref=f1e22]: POLYKRAN® es una tecnología de materiales desarrollada por Polymers Seals Solutions para mejorar el desempeño de componentes elastoméricos sometidos a condiciones severas de operación.
      - list [ref=f1e23]:
        - listitem [ref=f1e24]: Altas presiones
        - listitem [ref=f1e25]: Temperaturas extremas
        - listitem [ref=f1e26]: Fricción y desgaste
        - listitem [ref=f1e27]: Hidrocarburos, H₂S y químicos agresivos
    - img "Corte de un sello POLYKRAN® con zoom a su estructura interna reforzada con microfibras de aramida" [ref=f1e30]
  - generic [ref=f1e32]:
    - generic [ref=f1e33]:
      - generic [ref=f1e34]: LA TECNOLOGÍA
      - heading "Una estructura interna reforzada" [level=2] [ref=f1e35]
    - generic [ref=f1e36]:
      - img "Microfibras de aramida de alta resistencia vistas de cerca" [ref=f1e38]
      - paragraph [ref=f1e40]: Su desarrollo combina elastómeros de alto desempeño con microfibras de aramida de alta resistencia, incorporadas y distribuidas dentro de la matriz elastomérica para generar una estructura interna reforzada, capaz de incrementar la estabilidad mecánica del material sin comprometer la elasticidad requerida para el funcionamiento del sistema de sellado.
  - generic [ref=f1e41]:
    - generic [ref=f1e42]:
      - generic [ref=f1e43]: EL REFUERZO
      - heading "Aramida (Kevlar®) de alto desempeño para mayor resistencia mecánica y a la extrusión" [level=2] [ref=f1e44]
    - generic [ref=f1e47]:
      - article [ref=f1e48]:
        - text: "01"
        - generic [ref=f1e49]: Refuerzo interno
        - heading "Un elemento de refuerzo interno en la matriz" [level=3] [ref=f1e51]
        - paragraph [ref=f1e52]: Las microfibras de aramida (Kevlar®) actúan como un elemento de refuerzo interno dentro de la matriz elastomérica, aportando alta resistencia mecánica, estabilidad térmica y mayor capacidad para soportar esfuerzos de compresión, corte y deformación.
      - article [ref=f1e53]:
        - text: "02"
        - generic [ref=f1e54]: Bajo alta presión
        - heading "Distribuye los esfuerzos y frena la extrusión" [level=3] [ref=f1e55]
        - paragraph [ref=f1e56]: Bajo condiciones de alta presión, esta estructura reforzada contribuye a distribuir los esfuerzos mecánicos a través de la matriz, restringir la deformación excesiva y aumentar la resistencia del material frente a fenómenos de extrusión y daño mecánico.
      - article [ref=f1e57]:
        - text: "03"
        - generic [ref=f1e58]: El equilibrio
        - heading "Conserva la elasticidad y la fuerza de sellado" [level=3] [ref=f1e59]
        - paragraph [ref=f1e60]: Al mismo tiempo, la matriz elastomérica conserva la elasticidad, capacidad de recuperación y conformabilidad necesarias para adaptarse a las superficies de contacto, comprimirse durante la instalación y mantener la fuerza de sellado durante el servicio, logrando un equilibrio entre rigidez estructural, resistencia mecánica y comportamiento elastomérico.
  - generic [ref=f1e62]:
    - generic [ref=f1e63]:
      - generic [ref=f1e64]: LAS TRES VARIANTES
      - heading "NEKLON®, H-NEKLON® y VIKLON®" [level=2] [ref=f1e65]
      - paragraph [ref=f1e66]: El refuerzo de microfibras de aramida es compatible con distintos polímeros base. Cada variante lo incorpora sobre un tipo de caucho diferente, que aporta distintas características.
    - generic [ref=f1e67]:
      - article [ref=f1e68]:
        - generic [ref=f1e69]: "Base: Nitrilo · NBR"
        - generic [ref=f1e70]: NEKLON®
        - generic [ref=f1e71]:
          - generic [ref=f1e72]: Rango térmico
          - strong [ref=f1e73]: −30 a +120 °C
        - paragraph [ref=f1e74]: Caucho nitrilo (NBR) con el refuerzo de aramida. Resistente a aceites minerales e hidrocarburos; buena resistencia a extrusión, corte y desgaste.
        - generic [ref=f1e75]:
          - generic [ref=f1e76]: Aplicación
          - generic [ref=f1e77]: Vee packing, stuffing boxes, swab cups y sellos dinámicos en crudo dulce y servicio general.
      - article [ref=f1e78]:
        - generic [ref=f1e79]: "Base: Nitrilo hidrogenado · HNBR"
        - generic [ref=f1e80]: H-NEKLON®
        - generic [ref=f1e81]:
          - generic [ref=f1e82]: Rango térmico
          - strong [ref=f1e83]: −40 a +160 °C
        - paragraph [ref=f1e84]: Caucho nitrilo hidrogenado (HNBR) con el refuerzo de aramida. Soporta más temperatura y es compatible con gas agrio (H₂S), donde el NBR no llega.
        - generic [ref=f1e85]:
          - generic [ref=f1e86]: Aplicación
          - generic [ref=f1e87]: Vee packing HPHT, BOP seals, packer elements, stripper rubbers y sellos de wireline en alta presión y temperatura.
      - article [ref=f1e88]:
        - generic [ref=f1e89]: "Base: FKM · Vitón®"
        - generic [ref=f1e90]: VIKLON®
        - generic [ref=f1e91]:
          - generic [ref=f1e92]: Rango térmico
          - strong [ref=f1e93]: −20 a +200 °C
        - paragraph [ref=f1e94]: "Caucho fluorado (FKM / Vitón®) con el refuerzo de aramida. La base con más resistencia química y térmica: solventes aromáticos, H₂S severo y CO₂."
        - generic [ref=f1e95]:
          - generic [ref=f1e96]: Aplicación
          - generic [ref=f1e97]: Sellos en pozos HPHT con química agresiva, BOP seals de alta exigencia y completamiento crítico.
